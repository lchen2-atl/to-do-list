<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Todo</h1>
        </header>
        
        <main>
            <div class="add-todo">
                <input type="text" id="todoInput" placeholder="Add a new todo..." maxlength="200">
                <button id="addBtn" type="button">Add</button>
            </div>
            
            <ul id="todoList" class="todo-list">
                <!-- Todos will be dynamically added here -->
            </ul>
            
            <div class="stats" id="stats">
                <span id="totalCount">0 tasks</span>
            </div>
        </main>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
